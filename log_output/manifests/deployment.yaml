apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: writer
          image: nikosmrb/log_output_writer:1.10
          volumeMounts:
            - name: shared-data
              mountPath: /usr/src/app/files
        - name: reader
          image: nikosmrb/log_output_reader:1.11.1
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: shared-data
              mountPath: /usr/src/app/files
